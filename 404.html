<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | United Web Solutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0B2C5F; --secondary: #D89B00; }
        body { font-family: 'Poppins', sans-serif; background: var(--primary); color: white; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
        h1 { font-family: 'Playfair Display', serif; font-size: 8rem; color: var(--secondary); margin: 0; line-height: 1; }
        .btn-gold { background: var(--secondary); color: white; border: none; padding: 12px 30px; border-radius: 50px; font-weight: 600; text-decoration: none; display: inline-block; margin-top: 20px; transition: transform 0.3s; }
        .btn-gold:hover { transform: translateY(-3px); color: white; }
    </style>
</head>
<body>
    <div class="container">
        <i class="fas fa-exclamation-triangle fa-4x mb-3" style="color: var(--secondary);"></i>
        <h1>404</h1>
        <h2 class="mt-3">Oops! Page Not Found</h2>
        <p class="lead">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="index.html" class="btn-gold"><i class="fas fa-home me-2"></i>Back to Home</a>
    </div>
</body>
</html>
